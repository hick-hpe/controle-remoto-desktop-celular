<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
    <title>Hello, world!</title>
</head>

<body class="min-vh-100 bg-light d-flex flex-column">

    <!-- Navbar -->
    <div class="border-bottom border-1 p-3 fs-4 ps-5">
        Scan QR-code
    </div>

    <!-- Conteúdo -->
    <div class="flex-grow-1 d-flex justify-content-center align-items-center">
        <form>
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" placeholder="Nome">
            </div>

            <div class="mb-3 text-center">
                <img id="meu-qr-code" src="" alt="QR Code">

                <div id="status-conexao" style="display: none; margin-top: 15px; font-weight: bold; color: #28a745;">
                    📱 Celular Conectado!!
                </div>
            </div>  

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl-+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script defer src="/socket.io/socket.io.js"></script>
    <script defer src="/js/main.js"></script>
    <script defer src="scripts.js"></script>


</body>

</html>
